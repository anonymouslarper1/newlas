<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com">
  <title>Control</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="card">
    <!-- PIN login -->
    <section id="login">
      <div class="logo">🔒</div>
      <h1>Admin</h1>
      <p class="sub">Enter your PIN</p>
      <form id="loginForm" autocomplete="off">
        <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="12" placeholder="••••" required autofocus>
        <button type="submit">Unlock</button>
      </form>
      <p id="loginMsg" class="msg"></p>
    </section>

    <!-- One-time connection (only shown if the site has never been connected, or the key stopped working) -->
    <section id="setup" hidden>
      <div class="logo">🔧</div>
      <h1>Connect once</h1>
      <p class="sub">Only needed one time, ever. After this, every device just uses the PIN.</p>
      <form id="setupForm" autocomplete="off">
        <input id="token" type="password" placeholder="GitHub token (github_pat_...)" required>
        <button type="submit">Connect</button>
      </form>
      <p id="setupMsg" class="msg"></p>
    </section>

    <!-- Panel -->
    <section id="panel" hidden>
      <div class="row">
        <h1>Redirect link</h1>
        <button id="logout" class="ghost">Lock</button>
      </div>
      <p class="sub">Every visitor is sent here instantly.</p>
      <div class="current">
        <span>Current</span>
        <a id="current" target="_blank" rel="noopener noreferrer">loading…</a>
      </div>
      <form id="urlForm">
        <input id="url" type="url" placeholder="https://..." required>
        <button type="submit">Save</button>
      </form>
      <p id="panelMsg" class="msg"></p>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
