name: SparkIntelligence
options:
  bundleIdPrefix: com.sparkintelligence
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  SparkIntelligence:
    type: application
    platform: iOS
    sources:
      - SparkIntelligence
      - Shared
    dependencies:
      - target: SparkBroadcast
        embed: true
    entitlements:
      path: SparkIntelligence/SparkIntelligence.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sparkintelligence.app
    info:
      path: SparkIntelligence/Info.plist
      properties:
        CFBundleDisplayName: Spark Intelligence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkintelligence.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
  SparkBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - SparkBroadcast
      - Shared
    entitlements:
      path: SparkBroadcast/SparkBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sparkintelligence.app
    info:
      path: SparkBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Spark Intelligence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkintelligence.app.broadcast
        APPLICATION_EXTENSION_API_ONLY: "YES"
